<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182033"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb03c"/>
      <stop offset=".55" stop-color="#ff5f5f"/>
      <stop offset="1" stop-color="#c25cff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 镜片：热渐变描边 -->
  <circle cx="28" cy="27" r="16" fill="#1c2438" stroke="url(#heat)" stroke-width="4"/>
  <line x1="39.6" y1="38.6" x2="51" y2="51" stroke="url(#heat)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- 镜片里的「词」：纯路径，不依赖字体 -->
  <g transform="translate(16.4,16.25)" fill="none" stroke="#f2f5ff"
     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 讠 -->
    <path d="M3 2 L5.2 4.6"/>
    <path d="M0.8 10 L7.4 10 L4.6 16.5 L8 13.8"/>
    <!-- 司 -->
    <path d="M11 2 L23.2 2 L23.2 15.5 Q23.2 17.8 21 17.8 L19.8 17.8"/>
    <path d="M14.5 7.5 L20 7.5"/>
    <rect x="14.2" y="12.2" width="5.6" height="7" rx="1"/>
  </g>
</svg>
